name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Ari-147
      
          outputs: |
            dist/github-snake.svg
    
          color_snake: "#38bdf8"
          color_dots: "#1f2937,#1e40af,#312e81,#0f172a"
          color_empty: "#0f172a"
          color_background: "#0f172a"

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
